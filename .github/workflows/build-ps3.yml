name: Build SM64 PS3 Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 make zip unzip curl

      - name: Download sm64-port source
        run: |
          curl -L https://github.com/sm64pc/sm64port/archive/refs/heads/main.zip -o sm64.zip
          unzip -q sm64.zip
          cp -r sm64port-main/* .
          rm -rf sm64.zip sm64port-main

      - name: Prepare ROM asset
        run: |
          if [ -f "Super Mario 64 (USA).z64" ]; then
            cp "Super Mario 64 (USA).z64" baserom.us.z64
          fi
          ls -la

      - name: Compile for SM64
        run: |
          make VERSION=us -j$(nproc)

      - name: Package Output Files
        run: |
          mkdir -p pkg_out
          find build/ -type f \( -name "*.elf" -o -name "*.bin" -o -name "*.z64" \) -exec cp {} pkg_out/ \; || true
          ls -la pkg_out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-output
          path: pkg_out/
