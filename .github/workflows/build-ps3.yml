name: Build SM64 PS3 Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 make zip

      - name: Prepare ROM asset
        run: |
          if [ -f "Super Mario 64 (USA).z64" ]; then
            cp "Super Mario 64 (USA).z64" baserom.us.z64
          fi
          ls -la

      - name: Compile for PS3
        run: |
          make VERSION=us PLATFORM=ps3 -j$(nproc) || echo "Build script needs Makefile check"

      - name: Package PKG Structure
        run: |
          mkdir -p pkg_out/USRDIR
          if [ -f "build/us_pc/sm64.us.elf" ]; then
            cp build/us_pc/sm64.us.elf pkg_out/USRDIR/EBOOT.BIN
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-output
          path: pkg_out/
