name: Build SM64 PS3 Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ps3dev/ps3dev:latest # PS3 geliştirme ortamını içeren Docker imajı

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y python3 make git zip

      - name: Prepare ROM asset
        run: |
          # Yüklediğin ROM dosyasını portun isteyeceği adla kopyala/ayarla
          if [ -f "Super Mario 64 (USA).z64" ]; then
            cp "Super Mario 64 (USA).z64" baserom.us.z64
          fi
          ls -la

      - name: Compile for PS3
        run: |
          # PS3 için derleme komutları (Makefile yapısına göre uyarlanır)
          make VERSION=us PLATFORM=ps3 -j$(nproc)

      - name: Package PKG Structure
        run: |
          # Derlenen ELF dosyasını PKG formatına dönüştürme hazırlığı
          mkdir -p pkg_out/USRDIR
          if [ -f "build/us_pc/sm64.us.elf" ]; then
            cp build/us_pc/sm64.us.elf pkg_out/USRDIR/EBOOT.BIN
          elif [ -f "build/us_ps3/sm64.us.elf" ]; then
            cp build/us_ps3/sm64.us.elf pkg_out/USRDIR/EBOOT.BIN
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-output
          path: pkg_out/
