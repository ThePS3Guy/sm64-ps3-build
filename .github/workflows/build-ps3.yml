      - name: Build PS3 SELF and PKG
        run: |
          set -eux

          docker pull markstreet/sm64:ps3

          docker run --rm \
            -v "$GITHUB_WORKSPACE/sm64-port:/sm64" \
            -w /sm64 \
            markstreet/sm64:ps3 \
            sh -c '
              set -eu

              echo "=== Building SELF ==="

              make --jobs 4

              SELF="build/us_ps3/sm64.us.f3dex2e.self"

              test -s "$SELF"

              echo "=== Building PKG ==="

              make pkg

              PKG="build/us_ps3/sm64.us.f3dex2e.pkg"

              test -s "$PKG"

              echo "=== BUILD SUCCESS ==="
              ls -lh "$SELF" "$PKG"
            '