
name: Build SM64 PS3 PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ROM
        run: |
          set -e
          test -f "Super Mario 64 (USA).z64"
          echo "ROM found."

      - name: Download PS3 source
        run: |
          set -e

          git clone \
            --branch ps3 \
            --recursive \
            https://github.com/sdiraimondo/sm64-ps3-port.git \
            sm64-port

          test -f sm64-port/Makefile

      - name: Prepare ROM
        run: |
          set -e
          cp "Super Mario 64 (USA).z64" \
            sm64-port/baserom.us.z64

      - name: Build PS3 PKG
        run: |
          set -e

          docker pull markstreet/sm64:ps3

          docker run --rm \
            -v "$GITHUB_WORKSPACE/sm64-port:/sm64" \
            -w /sm64 \
            markstreet/sm64:ps3 \
            make --jobs 4 \
            build/us_ps3/sm64.us.f3dex2e.pkg

      - name: Verify PKG
        run: |
          set -e

          PKG="sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg"

          if [ ! -s "$PKG" ]; then
            echo "ERROR: PKG file not generated!"
            find sm64-port/build -type f || true
            exit 1
          fi

          echo "PKG successfully generated!"
          ls -lh "$PKG"

      - name: Package output
        run: |
          set -e

          mkdir -p pkg_out

          cp sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg \
            pkg_out/

      - name: Upload PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: SM64-PS3-PKG
          path: pkg_out/*.pkg
          if-no-files-found: error
          retention-days: 14