
name: Build SM64 PS3 Port

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Super Mario 64 for PS3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ROM
        run: |
          set -e

          if [ ! -f "Super Mario 64 (USA).z64" ]; then
            echo "ERROR: ROM file not found!"
            exit 1
          fi

          echo "ROM found."
          ls -lh "Super Mario 64 (USA).z64"

      - name: Clone PS3 source
        run: |
          set -e

          git clone \
            --branch ps3 \
            --recursive \
            https://github.com/fgsfdsfgs/sm64-port.git \
            sm64-port

          test -f sm64-port/Makefile

      - name: Prepare ROM
        run: |
          set -e

          cp "Super Mario 64 (USA).z64" \
            sm64-port/baserom.us.z64

          test -f sm64-port/baserom.us.z64

      - name: Build PS3 version
        run: |
          set -e

          docker pull markstreet/sm64:ps3

          docker run --rm \
            -v "$GITHUB_WORKSPACE/sm64-port:/sm64" \
            -w /sm64 \
            markstreet/sm64:ps3 \
            make --jobs "$(nproc)"

      - name: Verify build
        run: |
          set -e

          OUTPUT="sm64-port/build/us_ps3"

          if [ ! -f "$OUTPUT/sm64.us.f3dex2e.self" ]; then
            echo "ERROR: PS3 SELF file was not generated!"
            echo "Build directory contents:"
            find sm64-port/build -maxdepth 3 -type f || true
            exit 1
          fi

          echo "PS3 build successful!"
          ls -lh "$OUTPUT"

      - name: Package output
        run: |
          set -e

          mkdir -p pkg_out

          cp sm64-port/build/us_ps3/sm64.us.f3dex2e.self \
            pkg_out/

          if [ -f sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg ]; then
            cp sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg \
              pkg_out/
          fi

          ls -lh pkg_out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-output
          path: pkg_out/
          if-no-files-found: error
          retention-days: 14