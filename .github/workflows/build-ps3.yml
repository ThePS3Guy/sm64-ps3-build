name: Build SM64 PS3 PKG

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS3 PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ROM
        run: |
          set -e

          if [ ! -f "Super Mario 64 (USA).z64" ]; then
            echo "ERROR: ROM file not found!"
            exit 1
          fi

          echo "ROM found."

      - name: Clone PS3 source
        run: |
          set -e

          git clone \
            --branch ps3 \
            --recursive \
            https://github.com/fgsfdsfgs/sm64-port.git \
            sm64-port

          test -f sm64-port/Makefile

      - name: Prepare ROM
        run: |
          set -e

          cp "Super Mario 64 (USA).z64" \
            sm64-port/baserom.us.z64

          test -f sm64-port/baserom.us.z64

      - name: Download Docker image
        run: |
          set -e

          docker pull markstreet/sm64:ps3

      - name: Check build environment
        run: |
          set -e

          docker run --rm \
            markstreet/sm64:ps3 \
            sh -lc '
              echo "Checking build tools..."

              command -v make
              command -v python || true
              command -v python2 || true
              command -v python2.7 || true
              command -v pkg-config || true

              echo "Environment check completed."
            '

      - name: Build PS3 PKG
        run: |
          set -e

          docker run --rm \
            -v "$GITHUB_WORKSPACE/sm64-port:/sm64" \
            -w /sm64 \
            markstreet/sm64:ps3 \
            sh -lc '
              set -eux

              if ! command -v python2.7 >/dev/null 2>&1; then
                if command -v apt-get >/dev/null 2>&1; then
                  apt-get update
                  apt-get install -y python2.7
                else
                  echo "Python 2.7 is missing and apt-get is unavailable."
                  exit 1
                fi
              fi

              python2.7 --version

              echo "Starting PS3 PKG build..."

              make --jobs 4 \
                build/us_ps3/sm64.us.f3dex2e.pkg

              echo "Build finished."
            '

      - name: Verify PKG
        run: |
          set -e

          PKG="sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg"

          if [ ! -s "$PKG" ]; then
            echo "ERROR: PKG file was not generated!"

            find sm64-port/build \
              -maxdepth 4 \
              -type f || true

            exit 1
          fi

          echo "PKG generated successfully!"
          ls -lh "$PKG"

      - name: Prepare output
        run: |
          set -e

          mkdir -p pkg_out

          cp \
            sm64-port/build/us_ps3/sm64.us.f3dex2e.pkg \
            pkg_out/

          ls -lh pkg_out/

      - name: Upload PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: SM64-PS3-PKG
          path: pkg_out/*.pkg
          if-no-files-found: error
          retention-days: 14