name: Build SM64 PS3 PKG and SELF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PS3 PKG and SELF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ROM
        run: |
          set -e

          if [ ! -f "Super Mario 64 (USA).z64" ]; then
            echo "ERROR: ROM file not found!"
            exit 1
          fi

          echo "ROM found."

      - name: Clone PS3 source
        run: |
          set -e

          git clone \
            --branch ps3 \
            --recursive \
            https://github.com/fgsfdsfgs/sm64-port.git \
            sm64-port

          test -f sm64-port/Makefile

      - name: Prepare ROM
        run: |
          set -e

          cp "Super Mario 64 (USA).z64" \
            sm64-port/baserom.us.z64

          test -s sm64-port/baserom.us.z64

      - name: Pull PS3 Docker image
        run: |
          set -e
          docker pull markstreet/sm64:ps3

      - name: Build PS3 SELF and PKG
        run: |
          set -e

          docker run --rm \
            -v "$GITHUB_WORKSPACE/sm64-port:/sm64" \
            -w /sm64 \
            markstreet/sm64:ps3 \
            sh -c '
              set -eu

              echo "Starting PS3 build..."

              make --jobs 4

              echo "Checking SELF..."

              test -s build/us_ps3/sm64.us.f3dex2e.self

              echo "Building PKG..."

              make build/us_ps3/sm64.us.f3dex2e.pkg

              echo "Checking PKG..."

              test -s build/us_ps3/sm64.us.f3dex2e.pkg

              echo "Build completed successfully!"
            '

      - name: Verify build outputs
        run: |
          set -e

          BUILD_DIR="sm64-port/build/us_ps3"

          SELF="$BUILD_DIR/sm64.us.f3dex2e.self"
          PKG="$BUILD_DIR/sm64.us.f3dex2e.pkg"

          test -s "$SELF"
          test -s "$PKG"

          echo "SELF:"
          ls -lh "$SELF"

          echo "PKG:"
          ls -lh "$PKG"

      - name: Prepare download files
        run: |
          set -e

          mkdir -p pkg_out

          BUILD_DIR="sm64-port/build/us_ps3"

          cp "$BUILD_DIR/sm64.us.f3dex2e.self" pkg_out/
          cp "$BUILD_DIR/sm64.us.f3dex2e.pkg" pkg_out/

          # Include additional PKG variants if generated.
          find "$BUILD_DIR" -maxdepth 1 \
            -type f -name "*.pkg" \
            ! -name "sm64.us.f3dex2e.pkg" \
            -exec cp {} pkg_out/ \;

          echo "Final output:"
          ls -lh pkg_out/

      - name: Upload PS3 files
        uses: actions/upload-artifact@v4
        with:
          name: SM64-PS3-FILES
          path: pkg_out/
          if-no-files-found: error
          retention-days: 14