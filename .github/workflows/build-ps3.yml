name: Build SM64 PS3 Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y build-essential git python3 make zip unzip curl libaudiofile-dev
          else
            apt-get update && apt-get install -y build-essential git python3 make zip unzip curl libaudiofile-dev
          fi

      - name: Download source safely
        run: |
          set -e
          curl -fSL -A "Mozilla/5.0" "https://github.com/fgsfdsfgs/sm64-port/archive/refs/heads/ps3.zip" -o sm64.zip
          unzip -tq sm64.zip
          unzip -q sm64.zip
          SRC_DIR=$(find . -maxdepth 1 -type d -name "sm64-port-*" | head -n 1)
          test -n "$SRC_DIR"
          cp -rn "$SRC_DIR"/* .
          rm -rf sm64.zip "$SRC_DIR"
          test -f Makefile

      - name: Prepare ROM asset
        run: |
          set -e
          test -f "Super Mario 64 (USA).z64"
          cp "Super Mario 64 (USA).z64" baserom.us.z64
          ls -lh baserom.us.z64

      - name: Compile
        run: |
          set -e
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PSL1GHT="${PSL1GHT:-$PS3DEV/psl1ght}"
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PSL1GHT/bin"
          export CPPFLAGS="-include cstdint"
          export CXXFLAGS="-fpermissive -std=gnu++14 -include cstdint"
          ls -ld "$PSL1GHT"
          make VERSION=us -j$(nproc)

      - name: Package Output Files
        run: |
          set -e
          mkdir -p pkg_out
          find build/ -type f \( -name "*.elf" -o -name "*.bin" -o -name "*.self" -o -name "*.pkg" -o -name "sm64*" \) -exec cp {} pkg_out/ \;
          ls -la pkg_out/
          test "$(ls -A pkg_out)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-output
          path: pkg_out/
